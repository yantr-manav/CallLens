# CallLens — n8n orchestration (self-hosted, $0, always-on)
#
# `restart: unless-stopped` is what makes n8n come back after a crash or a
# machine reboot. Docker itself doesn't make anything run forever — an
# always-on machine does. Run this on any always-on host (your own server,
# a Raspberry Pi, or the free Oracle Cloud Always-Free VM). The container
# survives restarts.
#
# The port is bound to 127.0.0.1 ONLY — there is no open inbound port on the
# public internet. Expose n8n to the Vercel app through a Cloudflare Tunnel
# (infra/cloudflared-config.yml) instead of port-forwarding.
#
# Usage:
#   cp .env.example .env   # then edit .env
#   docker compose up -d
#   docker compose logs -f
#
# n8n editor then available at http://localhost:5678 (on the host).

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: calllens-n8n
    restart: unless-stopped
    environment:
      # ── App ──
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https                       # behind the tunnel it's HTTPS
      - WEBHOOK_URL=${WEBHOOK_URL}               # public URL n8n advertises for webhooks
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY} # secrets/credentials encryption
      # ── Editor basic auth (nobody but you can open the workflow editor) ──
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_ADMIN_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD}
      # ── Security hardening ──
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=true
      # Allow the Code node to use the built-in 'crypto' module (HMAC verification).
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # Shared CallLens secrets (mirror the app .env — every secret lives in
      # one place: infra/.env).
      - CALLLENS_WEBHOOK_SECRET=${CALLLENS_WEBHOOK_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      # 127.0.0.1 only — not exposed to the public internet.
      # If you need LAN access on a local server, change to "5678:5678".
      - "127.0.0.1:5678:5678"

  # Optional: free Cloudflare Tunnel to expose the local-only n8n to the
  # internet with HTTPS + no open ports. Enable by adding your tunnel token
  # to .env (CLOUDFLARE_TUNNEL_TOKEN). Disabled by default (no token → no-op).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: calllens-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - n8n
    profiles: ["tunnel"]   # only starts when --profile tunnel is passed

volumes:
  n8n_data:
    name: calllens-n8n-data